<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>

    <meta name="description"
      content="WDD 131 Dynamic Web Fundamentals homepage with responsive layout, accessibility, and dynamic footer dates." />
    <meta name="author" content="[Irene Gavina Costales]">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@300;400&display=swap"
      rel="stylesheet">

    <link rel="stylesheet" href="styles/responsive-images.css">

</head>

<body>

    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="Temple name and location" width="500"
                  height="250">
            </picture>
        </div>
    </main>

</body>

</html>
