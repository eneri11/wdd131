<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Explore Philippines">

    <title>Contact | Explore Philippines</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- JavaScript -->
    <script src="scripts/main.js" defer></script>
    <script src="scripts/form.js" defer></script>

</head>

<body>

    <header>

        <h1>Explore Philippines</h1>

        <button id="menu-button" aria-label="Open navigation menu">
            ☰
        </button>

        <nav aria-label="Primary Navigation">

            <ul class="navigation">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="destinations.html">Destinations</a>
                </li>

                <li>
                    <a href="tips.html">Travel Tips</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="contact-section">

            <h2>Contact Us</h2>

            <form id="contact-form">

                <label for="fullname">
                    Full Name
                </label>

                <input type="text" id="fullname" name="fullname" required>

                <label for="email">
                    Email
                </label>

                <input type="email" id="email" name="email" required>

                <label for="destination">
                    Favorite Destination
                </label>

                <select id="destination" name="destination">

                    <option value="Palawan">
                        Palawan
                    </option>

                    <option value="Baguio">
                        Baguio
                    </option>

                    <option value="Bohol">
                        Bohol
                    </option>

                </select>

                <label for="message">
                    Message
                </label>

                <textarea id="message" name="message" rows="5" required>
                </textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

            <div id="form-message"></div>

        </section>

    </main>

    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            ⛵ Explore Philippines ⛵ Irene Gavina Costales
        </p>

        <p id="lastModified"></p>

        <p>
            <a href="references.html">
                References
            </a>
        </p>

    </footer>

</body>

</html>
