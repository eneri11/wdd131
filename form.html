<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Submit a product review form">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
        <p>Share your experience with our products</p>
    </header>

    <main>

        <form action="review.html" method="get">

            <!-- Product -->
            <label for="product">Product Name <span class="required">*</span></label>
            <select id="product" name="product" required aria-required="true">
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Rating -->
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>

                <label><input type="radio" name="rating" value="1" required> ☆☆☆☆☆</label>
                <label><input type="radio" name="rating" value="2"> ★☆☆☆☆</label>
                <label><input type="radio" name="rating" value="3"> ★★☆☆☆</label>
                <label><input type="radio" name="rating" value="4"> ★★★☆☆</label>
                <label><input type="radio" name="rating" value="5"> ★★★★★</label>
            </fieldset>

            <!-- Date -->
            <label for="date">Date of Installation <span class="required">*</span></label>
            <input type="date" id="date" name="date" required aria-required="true">

            <!-- Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <label><input type="checkbox" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" name="features" value="design"> Design</label>
                <label><input type="checkbox" name="features" value="performance">
                    Performance</label>
                <label><input type="checkbox" name="features" value="battery"> Battery Life</label>
            </fieldset>

            <!-- Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5"></textarea>

            <!-- Username -->
            <label for="username">User Name (optional)</label>
            <input type="text" id="username" name="username">

            <!-- Submit -->
            <input type="submit" value="Submit Review">

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Product Review System</p>
    </footer>

</body>

</html>
