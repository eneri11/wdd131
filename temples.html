<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>

    <meta name="description"
      content="WDD 131 Dynamic Web Fundamentals homepage with responsive layout, accessibility, and dynamic footer dates." />
    <meta name="author" content="[Irene Gavina Costales]">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://font.googleapis.com/css2?family=Monserrat:wght@400;600;700&family=Roboto:wght@300;400&display=swap"
      rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <div class="header-container">
            <h2>Temple Album</h2>

            <button id="menuButton" aria-label="Menu">
                ☰
            </button>

            <nav id="navMenu">
                <a href="#">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Home</h1>

        <div class="gallery">

            <figure>
                <img src="images/manila_philippines_temple.jpeg" alt="Manila Philippines Temple"
                  loading="lazy">
                <figcaption>Manila Philippines Temple</figcaption>
            </figure>

            <figure>
                <img src="images/philippines_cebu_temple.jpeg" alt="Cebu Philippines Temple"
                  loading="lazy">
                <figcaption>Cebu Philippines Temple</figcaption>
            </figure>

            <figure>
                <img src="images/salt_lake_temple.jpeg" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/bern_switzerland.jpeg" alt="Bern Switzerland Temple"
                  loading="lazy">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>

            <figure>
                <img src="images/hamilton_new_zealand.jpeg" alt="Hamilton New Zealand Temple"
                  loading="lazy">
                <figcaption>Hamilton New Zealand Temple</figcaption>
            </figure>

            <figure>
                <img src="images/apia_samoa_temple_lds.jpeg" alt="Apia Samoa Temple" loading="lazy">
                <figcaption>Apia Samoa Temple</figcaption>
            </figure>

            <figure>
                <img src="images/recife_brazil_temple_lds.jpeg" alt="Recife Brazil Temple"
                  loading="lazy">
                <figcaption>Recife Brazil Temple</figcaption>
            </figure>

            <figure>
                <img src="images/calgary_alberta.jpeg" alt="Calgary Alberta Temple" loading="lazy">
                <figcaption>Calgary Alberta Temple</figcaption>
            </figure>

            <figure>
                <img src="images/palmyra_new_york.jpeg" alt="Palmyra New York Temple"
                  loading="lazy">
                <figcaption>Palmyra New York Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            ©<span id="currentYear"></span>
            ⛪ Irene Gavina Costales ⛪ Philippines
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
